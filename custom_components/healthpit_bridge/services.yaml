delete_workout:
  name: Delete workout
  description: Delete an imported workout from the Healthpit Bridge.
  fields:
    device_id:
      required: true
      selector:
        text:
      name: Device ID
    workout_id:
      required: true
      selector:
        text:
      name: Workout ID
    entry_id:
      required: false
      selector:
        text:
      name: Config entry ID

sync_hevy:
  name: Sync Hevy
  description: Start a Hevy sync on the Healthpit Bridge.
  fields:
    entry_id:
      required: false
      selector:
        text:
      name: Config entry ID

sync_garmin:
  name: Sync Garmin
  description: Start a Garmin sync on the Healthpit Bridge.
  fields:
    entry_id:
      required: false
      selector:
        text:
      name: Config entry ID

save_workout_link:
  name: Save workout link
  description: Save a manual workout merge or separation rule.
  fields:
    primary:
      required: true
      selector:
        text:
      name: Primary workout key
    linked:
      required: true
      selector:
        text:
      name: Linked workout key
    action:
      required: true
      selector:
        select:
          options:
            - merge
            - separate
      name: Action
    entry_id:
      required: false
      selector:
        text:
      name: Config entry ID

delete_workout_link:
  name: Delete workout link
  description: Delete a manual workout merge or separation rule.
  fields:
    primary:
      required: true
      selector:
        text:
      name: Primary workout key
    linked:
      required: true
      selector:
        text:
      name: Linked workout key
    entry_id:
      required: false
      selector:
        text:
      name: Config entry ID
