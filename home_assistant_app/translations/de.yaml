configuration:
  garmin:
    name: "Garmin Connect"
    description: >-
      Importiert Aktivitäten aus Garmin Connect. Die Zugangsdaten bleiben in
      der App und werden nie über die Bridge-API zurückgegeben.
    fields:
      enabled:
        name: "Synchronisieren"
        description: "Aktivitäten regelmäßig importieren (alle sechs Stunden)."
      email:
        name: "E-Mail"
        description: "E-Mail-Adresse des Garmin-Connect-Kontos."
      password:
        name: "Passwort"
        description: "Passwort des Garmin-Connect-Kontos."
      activity_limit:
        name: "Aktivitätslimit"
        description: "Maximale Anzahl importierter Aktivitäten pro Lauf."
  hevy:
    name: "Hevy"
    description: >-
      Importiert Workouts über die Hevy-API. Der öffentliche Zugang setzt
      derzeit ein Hevy-Pro-Konto voraus.
    fields:
      enabled:
        name: "Synchronisieren"
        description: "Workouts regelmäßig aus Hevy importieren."
      api_key:
        name: "API-Key"
        description: "API-Key aus den Entwicklereinstellungen der Hevy-Web-App."
      max_pages:
        name: "Seitenlimit"
        description: "Maximale Anzahl der pro Lauf abgerufenen API-Seiten."
      interval_minutes:
        name: "Intervall"
        description: "Synchronisationsintervall in Minuten."
  access:
    name: "Zugang und Sicherheit"
    description: >-
      Zugangsdaten für Healthpit auf dem iPhone, GymPit und die
      Home-Assistant-Integration. Die Voreinstellungen reichen für den ersten
      Start; das Token wird automatisch erzeugt.
    fields:
      username:
        name: "Benutzername"
        description: "Benutzername, den alle Clients bei der Anmeldung senden."
      token_mode:
        name: "Token-Erzeugung"
        description: >-
          Automatisch: die App erzeugt beim ersten Start ein zufälliges Token
          und behält es. Manuell: eigenes Token mit mindestens 32 Zeichen.
      api_token:
        name: "API-Token"
        description: >-
          Bei automatischer Erzeugung leer lassen. Das aktive Token steht in
          den App-Daten und ist in Home-Assistant-Sicherungen enthalten.
      two_factor_mode:
        name: "Zwei-Faktor-Authentifizierung"
        description: >-
          Sobald hier nicht „disabled“ steht, veröffentlicht die Integration
          den QR-Code als Bild-Entität zum Scannen.
      totp_secret:
        name: "TOTP-Secret"
        description: "Nur bei „manual“ nötig. Base32, mindestens 16 Zeichen."
      session_days:
        name: "Sitzungslaufzeit"
        description: >-
          Gültigkeit ausgegebener App-Sitzungen in Tagen. Voreinstellung 1825,
          also rund fünf Jahre.
  topology:
    name: "Topologie (nur für mehrere Bridges)"
    description: >-
      Als Master brauchst du hier nichts einzutragen — das ist die
      Voreinstellung und der Normalfall. Die Felder darunter sind nur
      auszufüllen, wenn du die Rolle auf „slave“ stellst, weil bereits eine
      andere Bridge oder ein anderes Addon der Master ist. Pro Benutzer darf es
      genau einen Master geben.
    fields:
      role:
        name: "Rolle dieses Knotens"
        description: >-
          master: Diese App besitzt die Daten und nimmt Clients an. slave:
          Diese App tritt zurück und meldet sich beim unten angegebenen Master.
      master_url:
        name: "Adresse des Masters"
        description: >-
          Nur bei „slave“. Zum Beispiel 192.168.178.20, host:8088 oder
          http://host:8088. Fehlendes Schema wird zu http, fehlender Port zu
          8088.
      master_username:
        name: "Benutzername beim Master"
        description: "Nur bei „slave“. Leer lassen übernimmt den Benutzernamen von oben."
      master_api_token:
        name: "API-Token des Masters"
        description: "Nur bei „slave“. Das Token, das der Master ausgibt."
      master_otp_code:
        name: "Einmaliger OTP-Code"
        description: >-
          Nur bei „slave“ und nur, wenn der Master 2FA verlangt. Der
          6-stellige Code wird einmalig für die Anmeldung gebraucht.
  system:
    name: "System"
    description: "Betriebsverhalten der App."
    fields:
      log_level:
        name: "Protokollstufe"
        description: "Detailgrad des App-Protokolls."
network:
  8088/tcp: "Bridge-API für Apps und Home Assistant"
