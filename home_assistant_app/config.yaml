name: "Healthpit Bridge"
version: "1.3.2"
slug: "healthpit_bridge"
description: >-
  Healthpit bridge for Apple Health, GymPit, Hevy, Garmin and native Home
  Assistant sensors. Runs as master or as slave of another Healthpit node.
url: "https://github.com/doctorspreter/healthpit/tree/main/home_assistant_app"
arch:
  - aarch64
  - amd64
startup: application
boot: auto
stage: stable
hassio_api: true
hassio_role: default
apparmor: true
backup: cold
discovery:
  - healthpit_bridge
ports:
  8088/tcp: 8088
ports_description:
  8088/tcp: "Healthpit Bridge API for iPhone, GymPit and Home Assistant"
watchdog: "http://[HOST]:[PORT:8088]/health"
options:
  garmin:
    enabled: false
    email: ""
    password: ""
    activity_limit: 200
  hevy:
    enabled: false
    api_key: ""
    max_pages: 10
    interval_minutes: 60
  access:
    username: "healthpit"
    token_mode: "automatic"
    api_token: ""
    two_factor_mode: "disabled"
    totp_secret: ""
    session_days: 1825
  topology:
    role: "master"
    master_url: ""
    master_username: ""
    master_api_token: ""
    master_otp_code: ""
  system:
    log_level: "info"
schema:
  garmin:
    enabled: bool
    email: "str?"
    password: "password?"
    activity_limit: "int(1,1000)"
  hevy:
    enabled: bool
    api_key: "password?"
    max_pages: "int(1,100)"
    interval_minutes: "int(15,1440)"
  access:
    username: "str(1,80)"
    token_mode: "list(automatic|manual)"
    api_token: "password?"
    two_factor_mode: "list(disabled|automatic|manual)"
    totp_secret: "password?"
    session_days: "int(1,3650)"
  topology:
    role: "list(master|slave)"
    master_url: "str?"
    master_username: "str?"
    master_api_token: "password?"
    master_otp_code: "str?"
  system:
    log_level: "list(debug|info|warning|error)"
