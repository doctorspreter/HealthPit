name: Build Home Assistant app

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "app-v*"
    paths:
      - "home_assistant_app/**"
      - ".github/workflows/build.yml"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve app version
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#app-v}"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]]; then
            version="$(sed -n 's/^version: "\(.*\)"/\1/p' home_assistant_app/config.yaml)"
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish amd64/aarch64 image
        uses: docker/build-push-action@v6
        with:
          context: ./home_assistant_app
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BUILD_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/healthpit-home-assistant-app:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/healthpit-home-assistant-app:latest
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
