name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  hacs:
    name: HACS integration
    runs-on: ubuntu-latest
    steps:
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: Home Assistant integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@master

  source:
    name: Source and metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check PyYAML
      - name: Validate Python, JSON, YAML, and shell
        shell: bash
        run: |
          python -m compileall -q custom_components home_assistant_app/app home_assistant_docker/app
          python - <<'PY'
          import json
          from pathlib import Path
          import yaml

          for path in Path(".").rglob("*.json"):
              if ".git" not in path.parts:
                  json.loads(path.read_text(encoding="utf-8"))
          for suffix in ("*.yaml", "*.yml"):
              for path in Path(".").rglob(suffix):
                  if ".git" not in path.parts and ".github/workflows" not in path.as_posix():
                      yaml.safe_load(path.read_text(encoding="utf-8"))
          PY
          bash -n home_assistant_app/run.sh
          (cd home_assistant_app && python -m unittest discover -s tests -v)
